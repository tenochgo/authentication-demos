<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Entra ID Auth Demos (Python){% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body data-page="{% block page_id %}{% endblock %}">
  <div class="d-flex">
    <aside class="sidebar p-3 bg-dark text-white">
      <h5>🔐 Entra ID Demos</h5>
      <nav class="nav flex-column gap-2 mt-3">
        <a class="nav-link text-white" href="/">Home</a>
        <a class="nav-link text-white" href="/service-principal">Service Principal</a>
        <a class="nav-link text-white" href="/on-behalf-of">On Behalf Of</a>
      </nav>
    </aside>
    <main class="flex-grow-1">
      <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
        <span class="fw-semibold">Entra ID Authentication & Authorization Demo (Python + Vanilla JS)</span>
        <div>
          {% if signed_in %}
            <span class="me-2">👤 {{ user_name }}</span>
            <a href="/MicrosoftIdentity/Account/SignOut" class="btn btn-sm btn-outline-dark">Sign out</a>
          {% else %}
            <a href="/MicrosoftIdentity/Account/SignIn" class="btn btn-sm btn-outline-primary">Sign in</a>
          {% endif %}
        </div>
      </div>
      <div class="p-4">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
